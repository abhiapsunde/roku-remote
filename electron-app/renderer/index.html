<!DOCTYPE html>
<html>
<head>
    <title>Roku Remote</title>
    <script src="spin.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 8px; }

        table, td, th {
            border-collapse: collapse;
            border: 0px solid black;
            text-align: center;
        }
        .crap {
            background: #FE9A2E;
            padding: 1px;
            border-spacing: 1px;
            border: 3px solid black;
        }
        .nicecolor {
            background: white;
            cursor: pointer;
        }
        .nicecolor:hover { background: #33CCCC; }

        img {
            opacity: 1;
            transition: .25s;
        }
        img:hover  { opacity: 0.5; }
        img:active { opacity: 1; }
    </style>
</head>
<body>
<div id="root">
    <div id="pad">
        <input type="button" id="start" value="Find Roku" disabled />
        <br><br>

        <div id="spinnn" style="display:none;">
            <h2>Finding Roku...</h2>
        </div>

        <div id="main" style="display:none;">
            <table style="width:100%">
                <tr>
                    <td><div id="Back"  class="nicecolor"><img src="svg/left-arrow8.svg"  height="33%" width="33%"></div></td>
                    <td><div id="blank"></div></td>
                    <td><div id="Home"  class="nicecolor"><img src="svg/home168.svg"      height="33%" width="33%"></div></td>
                </tr>
                <tr>
                    <td></td>
                    <td><div id="Up"    class="nicecolor"><img src="svg/left224.svg"      height="33%" width="33%" style="transform:rotate(90deg)"></div></td>
                    <td></td>
                </tr>
                <tr>
                    <td><div id="Left"  class="nicecolor"><img src="svg/left224.svg"      height="33%" width="33%"></div></td>
                    <td><div id="Select" class="nicecolor"><img src="svg/ok3.svg"         height="33%" width="33%"></div></td>
                    <td><div id="Right" class="nicecolor"><img src="svg/left224.svg"      height="33%" width="33%" style="transform:rotate(180deg)"></div></td>
                </tr>
                <tr>
                    <td></td>
                    <td><div id="Down"  class="nicecolor"><img src="svg/left224.svg"      height="33%" width="33%" style="transform:rotate(270deg)"></div></td>
                    <td></td>
                </tr>
                <tr>
                    <td><div id="InstantReplay" class="nicecolor"><img src="svg/circulararrow10.svg" height="33%" width="33%"></div></td>
                    <td></td>
                    <td><div id="Info"  class="nicecolor"><img src="svg/asterisk5.svg"    height="33%" width="33%"></div></td>
                </tr>
                <tr>
                    <td><div id="Rev"   class="nicecolor"><img src="svg/rewind28.svg"     height="33%" width="33%"></div></td>
                    <td><div id="Play"  class="nicecolor"><img src="svg/pause16.svg"      height="33%" width="33%"></div></td>
                    <td><div id="Fwd"   class="nicecolor"><img src="svg/fast19.svg"       height="33%" width="33%"></div></td>
                </tr>
                <tr><td colspan="3">
                    <table style="width:100%" class="crap">
                        <tr>
                            <td>URL: <input type="text" id="urlinpu" value="http://www.w3schools.com/html/mov_bbb.mp4" style="width:180px"></td>
                            <td><input type="button" id="sendToRoku" value="Play !"></td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <div id="rokuAppNotice" style="display:none; font-size:11px;">
                                    The Roku Media Player channel needs to be installed on your Roku.<br>
                                    <a href="https://my.roku.com/account/add?channel=LZZZCQ" target="_blank">Add it here</a>, then restart this app.
                                </div>
                            </td>
                        </tr>
                    </table>
                </td></tr>
            </table>

            <div id="output" style="font-family:Arial; font-size:12px; display:none;">
                <div id="friendly_name"></div>
            </div>
        </div>
    </div>
</div>

<div id="channelThing" style="overflow-y:auto; width:100%; height:200px; margin-top:8px;"></div>

<script src="renderer.js"></script>
</body>
</html>
