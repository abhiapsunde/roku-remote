<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roku Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:          #0b0b12;
            --remote-bg:   #13131e;
            --surface:     #1c1c2b;
            --surface-hi:  #242436;
            --border:      rgba(255,255,255,0.07);
            --border-hi:   rgba(255,255,255,0.13);
            --text:        #dde0f0;
            --text-dim:    #8888b0;
            --accent:      #7c3aed;
            --accent-lo:   rgba(124,58,237,0.18);
            --accent-glow: rgba(124,58,237,0.45);
            --raised:      0 2px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
            --pressed:     inset 0 2px 5px rgba(0,0,0,0.55);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── Screens ──────────────────────────────────── */
        #devicePicker, #remoteScreen {
            position: absolute; inset: 0;
            overflow-y: auto; scrollbar-width: none;
        }
        ::-webkit-scrollbar { display: none; }

        /* ── Discovery screen ─────────────────────────── */
        #devicePicker {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 24px 32px;
        }

        .picker-brand {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 36px;
        }
        .picker-brand svg { width: 28px; height: 28px; color: var(--accent); }
        .picker-brand span { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }

        /* Scan animation */
        #spinnn {
            position: relative; width: 96px; height: 96px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px; flex-shrink: 0;
        }
        .pr {
            position: absolute; border-radius: 50%;
            border: 1.5px solid var(--accent);
            animation: ring-pulse 2.2s ease-out infinite; opacity: 0;
        }
        .pr1 { width: 36px; height: 36px; animation-delay: 0s; }
        .pr2 { width: 60px; height: 60px; animation-delay: 0.55s; }
        .pr3 { width: 88px; height: 88px; animation-delay: 1.1s; }
        @keyframes ring-pulse {
            0%   { opacity: 0.8; transform: scale(0.85); }
            100% { opacity: 0;   transform: scale(1); }
        }
        .scan-icon-inner { z-index: 1; width: 26px; height: 26px; color: var(--accent); }
        #spinnn.idle .pr { animation: none; opacity: 0; }

        #scanStatus {
            font-size: 13px; color: var(--text-dim);
            letter-spacing: 0.02em; margin-bottom: 20px; text-align: center;
        }

        #deviceList {
            width: 100%; max-width: 288px;
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 20px; min-height: 8px;
        }

        .device-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .device-card:hover  { background: var(--surface-hi); border-color: var(--border-hi); }
        .device-card:active { transform: scale(0.97); }
        .device-card.active-device { border-color: var(--accent); background: var(--accent-lo); }

        .dc-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
        .dc-meta { font-size: 11px; color: var(--text-dim); font-family: monospace; letter-spacing: 0.03em; }
        .dc-arrow { width: 16px; height: 16px; color: var(--accent); opacity: 0.6; flex-shrink: 0; }
        .dc-check { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }
        .device-card:hover .dc-arrow { opacity: 1; }
        .no-dev { font-size: 13px; color: var(--text-dim); text-align: center; padding: 12px 0; }

        #start {
            background: transparent; border: 1.5px solid var(--border);
            border-radius: 20px; color: var(--text-dim);
            font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500;
            padding: 8px 20px; cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            transition: color 0.15s, border-color 0.15s;
        }
        #start svg { width: 13px; height: 13px; }
        #start:hover { color: var(--text); border-color: var(--border-hi); }
        #start:disabled { opacity: 0.4; pointer-events: none; }

        /* ── Remote screen ────────────────────────────── */
        #remoteScreen { display: flex; flex-direction: column; }

        /* Device bar */
        .dbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 9px 16px;
            background: var(--remote-bg); border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .dbar-dot {
            width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
            background: #22c55e; box-shadow: 0 0 7px rgba(34,197,94,0.6);
            animation: dot-blink 2.8s ease-in-out infinite;
        }
        @keyframes dot-blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

        /* Clickable device name — the whole left side is the switcher trigger */
        #changeDevice {
            display: flex; align-items: center; gap: 7px;
            background: transparent; border: none; padding: 4px 6px 4px 0;
            border-radius: 8px; cursor: pointer; color: var(--text);
            font-family: 'Outfit', sans-serif;
            transition: background 0.15s;
        }
        #changeDevice:hover { background: rgba(255,255,255,0.05); }
        #friendly_name { font-size: 12px; font-weight: 500; }
        .dbar-chevron {
            width: 13px; height: 13px; color: var(--text-dim); flex-shrink: 0;
        }

        /* Device count pill — shown when >1 device found */
        #deviceCount {
            font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
            color: var(--accent); background: var(--accent-lo);
            border-radius: 10px; padding: 2px 8px; flex-shrink: 0;
        }

        /* Remote body */
        .remote-wrap {
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center;
            padding: 14px 16px;
        }

        #main {
            width: 100%; max-width: 272px;
            background: var(--remote-bg); border-radius: 28px;
            padding: 18px 16px 20px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.055),
                0 28px 56px rgba(0,0,0,0.7),
                0 8px 24px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; gap: 14px;
        }

        /* Buttons */
        .row { display: flex; align-items: center; justify-content: center; gap: 10px; }

        .fn-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 9px 10px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); cursor: pointer;
            font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 500;
            box-shadow: var(--raised); transition: background 0.12s, transform 0.08s;
        }
        .fn-btn img { width: 15px; height: 15px; opacity: 0.75; filter: invert(1); flex-shrink: 0; }
        .fn-btn:hover  { background: var(--surface-hi); }
        .fn-btn:active { box-shadow: var(--pressed); transform: scale(0.96); }

        /* D-pad */
        .dpad-wrap { display: flex; justify-content: center; }
        .dpad { position: relative; width: 164px; height: 164px; }
        .dpad::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.015) 0%, transparent 70%);
            border: 1px solid rgba(255,255,255,0.04); pointer-events: none;
        }

        .da {
            position: absolute;
            background: var(--surface); border: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--raised); transition: background 0.1s;
        }
        .da img { width: 14px; height: 14px; filter: invert(1); opacity: 0.65; }
        .da:hover  { background: var(--surface-hi); }
        .da:active { box-shadow: var(--pressed); }

        .da-u { top:0;    left:54px; width:56px; height:56px; border-radius:10px 10px 0 0; border-bottom:none; }
        .da-d { bottom:0; left:54px; width:56px; height:56px; border-radius:0 0 10px 10px; border-top:none;    }
        .da-l { top:54px; left:0;    width:56px; height:56px; border-radius:10px 0 0 10px; border-right:none;  }
        .da-r { top:54px; right:0;   width:56px; height:56px; border-radius:0 10px 10px 0; border-left:none;   }

        .da-c {
            position: absolute; top:54px; left:54px; width:56px; height:56px;
            border-radius: 50%; background: var(--accent); border: none;
            cursor: pointer; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 14px var(--accent-glow), var(--raised);
            transition: background 0.12s, box-shadow 0.12s, transform 0.08s;
        }
        .da-c img { width: 20px; height: 20px; filter: invert(1); opacity: 0.9; }
        .da-c:hover  { background: #8b50f0; box-shadow: 0 4px 18px var(--accent-glow); }
        .da-c:active { transform: scale(0.94); box-shadow: 0 1px 6px var(--accent-glow); }

        .rot90  { transform: rotate(90deg);  }
        .rot180 { transform: rotate(180deg); }
        .rot270 { transform: rotate(270deg); }

        .icon-btn {
            width: 46px; height: 46px; border-radius: 50%;
            background: var(--surface); border: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--raised); transition: background 0.12s, transform 0.08s;
        }
        .icon-btn img { width: 17px; height: 17px; filter: invert(1); opacity: 0.65; }
        .icon-btn:hover  { background: var(--surface-hi); }
        .icon-btn:active { box-shadow: var(--pressed); transform: scale(0.95); }

        .media-btn {
            flex: 1; height: 42px; border-radius: 10px;
            background: var(--surface); border: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--raised); transition: background 0.12s;
        }
        .media-btn img { width: 19px; height: 19px; filter: invert(1); opacity: 0.65; }
        .media-btn:hover  { background: var(--surface-hi); }
        .media-btn:active { box-shadow: var(--pressed); }
        .media-play { background: var(--surface-hi); border-color: var(--border-hi); }
        .media-play img { opacity: 0.9; }
        .media-btn.vol-btn { position: relative; }
        .media-btn.vol-btn::after {
            content: 'Roku TV / HDMI-CEC only'; position: absolute; bottom: calc(100% + 6px); left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.85);
            color: #fff; font-size: 10px; white-space: nowrap;
            padding: 3px 7px; border-radius: 5px; pointer-events: none;
            opacity: 0; transition: opacity 0.15s;
        }
        .media-btn.vol-btn:hover::after { opacity: 1; }

        /* ── Channel grid ─────────────────────────────── */
        .channels-section {
            align-self: stretch; min-width: 0;
            padding-top: 18px; padding-bottom: 8px;
        }
        .channels-header {
            font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px;
        }
        .ecp-warning {
            font-size: 11px; color: var(--text-dim); line-height: 1.5;
            background: rgba(255,255,255,0.05); border-radius: 8px;
            padding: 10px 12px; border: 1px solid var(--border);
        }
        .ecp-warning strong { color: var(--text); display: block; margin-bottom: 4px; }
        #channelThing {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; min-width: 0;
        }
        .channel-tile {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            cursor: pointer; min-width: 0;
        }
        .channel-tile img {
            width: 100%; aspect-ratio: 3/2; border-radius: 8px; object-fit: cover;
            border: 1px solid var(--border);
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            display: block;
        }
        .channel-tile:hover img  { transform: scale(1.05); border-color: var(--border-hi); box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
        .channel-tile:active img { transform: scale(0.97); }
        .channel-tile span {
            font-size: 10px; color: var(--text-dim); text-align: center;
            width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ── Device switcher bottom sheet ─────────────── */
        #sheetBackdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            opacity: 0; pointer-events: none;
            transition: opacity 0.28s; z-index: 50;
        }
        #sheetBackdrop.open { opacity: 1; pointer-events: all; }

        #switcherSheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface);
            border-radius: 18px 18px 0 0;
            border-top: 1px solid var(--border-hi);
            padding: 8px 16px 32px;
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 51;
        }
        #switcherSheet.open { transform: translateY(0); }

        .sheet-handle {
            width: 36px; height: 4px; border-radius: 2px;
            background: var(--border-hi); margin: 6px auto 14px;
        }
        .sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .sheet-title { font-size: 14px; font-weight: 600; }
        .sheet-rescan {
            background: transparent; border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-dim);
            font-family: 'Outfit', sans-serif; font-size: 11px;
            padding: 4px 10px; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            transition: all 0.15s;
        }
        .sheet-rescan svg { width: 11px; height: 11px; }
        .sheet-rescan:hover { color: var(--text); border-color: var(--border-hi); }
        .sheet-rescan:disabled { opacity: 0.35; pointer-events: none; }

        #switcherList { display: flex; flex-direction: column; gap: 8px; }

        .switcher-card {
            background: var(--remote-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 13px 14px;
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .switcher-card:hover  { background: var(--surface-hi); border-color: var(--border-hi); }
        .switcher-card:active { transform: scale(0.98); }
        .switcher-card.current { border-color: var(--accent); }

        .sc-icon {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            background: var(--surface); display: flex; align-items: center; justify-content: center;
        }
        .sc-icon svg { width: 18px; height: 18px; color: var(--text-dim); }
        .switcher-card.current .sc-icon { background: var(--accent-lo); }
        .switcher-card.current .sc-icon svg { color: var(--accent); }

        .sc-info { flex: 1; min-width: 0; }
        .sc-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sc-meta { font-size: 11px; color: var(--text-dim); font-family: monospace; margin-top: 2px; }

        .sc-badge {
            font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
            color: var(--accent); background: var(--accent-lo);
            border-radius: 4px; padding: 2px 7px; flex-shrink: 0;
        }

        /* #output is now the status bar — always visible on remote screen */
    </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     DISCOVERY SCREEN
══════════════════════════════════════════ -->
<div id="devicePicker">
    <div class="picker-brand">
        <svg viewBox="0 0 24 24" fill="none">
            <rect x="2" y="5" width="20" height="14" rx="3" fill="currentColor" opacity="0.15"/>
            <rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
            <path d="M8.5 12a3.5 3.5 0 0 1 7 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <path d="M5.5 12a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.45"/>
        </svg>
        <span>Roku Remote</span>
    </div>

    <div id="spinnn">
        <div class="pr pr1"></div>
        <div class="pr pr2"></div>
        <div class="pr pr3"></div>
        <svg class="scan-icon-inner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 17.7a8 8 0 0 0 0-11.4" stroke-linecap="round"/>
        </svg>
    </div>

    <p id="scanStatus">Scanning your network…</p>
    <div id="deviceList"></div>

    <button id="start">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 4v6h6M23 20v-6h-6"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Scan Again
    </button>
</div>


<!-- ══════════════════════════════════════════
     REMOTE SCREEN
══════════════════════════════════════════ -->
<div id="remoteScreen" style="display:none">

    <!-- Status bar -->
    <div class="dbar" id="output">
        <button id="changeDevice">
            <div class="dbar-dot"></div>
            <span id="friendly_name"></span>
            <svg class="dbar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <span id="deviceCount" style="display:none"></span>
    </div>

    <div class="remote-wrap">
        <div id="main">

            <!-- Back + Home + Power -->
            <div class="row">
                <button class="fn-btn" id="Back">
                    <img src="svg/left-arrow8.svg" alt="">Back
                </button>
                <button class="fn-btn" id="Home">
                    <img src="svg/home168.svg" alt="">Home
                </button>
                <button class="fn-btn" id="Power" title="Power">
                    <img src="svg/power.svg" alt="">Power
                </button>
            </div>

            <!-- D-pad -->
            <div class="dpad-wrap">
                <div class="dpad">
                    <button class="da da-u" id="Up"><img src="svg/left224.svg" class="rot90" alt="Up"></button>
                    <button class="da da-l" id="Left"><img src="svg/left224.svg" alt="Left"></button>
                    <button class="da-c" id="Select"><img src="svg/ok3.svg" alt="OK"></button>
                    <button class="da da-r" id="Right"><img src="svg/left224.svg" class="rot180" alt="Right"></button>
                    <button class="da da-d" id="Down"><img src="svg/left224.svg" class="rot270" alt="Down"></button>
                </div>
            </div>

            <!-- Aux -->
            <div class="row">
                <button class="icon-btn" id="InstantReplay" title="Instant Replay">
                    <img src="svg/circulararrow10.svg" alt="Replay">
                </button>
                <button class="icon-btn" id="Info" title="Options">
                    <img src="svg/asterisk5.svg" alt="Options">
                </button>
            </div>

            <!-- Media -->
            <div class="row">
                <button class="media-btn" id="Rev"><img src="svg/rewind28.svg" alt="Rewind"></button>
                <button class="media-btn media-play" id="Play"><img src="svg/pause16.svg" alt="Play"></button>
                <button class="media-btn" id="Fwd"><img src="svg/fast19.svg" alt="Forward"></button>
            </div>

            <!-- Volume -->
            <div class="row">
                <button class="media-btn vol-btn" id="VolumeDown"><img src="svg/volume-down.svg" alt="Vol-"></button>
                <button class="media-btn vol-btn" id="VolumeMute"><img src="svg/mute.svg" alt="Mute"></button>
                <button class="media-btn vol-btn" id="VolumeUp"><img src="svg/volume-up.svg" alt="Vol+"></button>
            </div>

        </div>

        <!-- Channel grid — fills remaining scroll space -->
        <div class="channels-section">
            <div class="channels-header">Channels</div>
            <div id="channelThing"></div>
        </div>

    </div><!-- .remote-wrap -->

</div>


<!-- ══════════════════════════════════════════
     DEVICE SWITCHER BOTTOM SHEET
══════════════════════════════════════════ -->
<div id="sheetBackdrop"></div>
<div id="switcherSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <span class="sheet-title">Switch Device</span>
        <button class="sheet-rescan" id="sheetRescan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 4v6h6M23 20v-6h-6"/>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
            </svg>
            Rescan
        </button>
    </div>
    <div id="switcherList"></div>
</div>

<!-- used by renderer.js, kept hidden -->
<div id="rokuAppNotice" style="display:none"></div>

<script src="renderer.js"></script>
</body>
</html>
